worker_processes 1;
error_log rehearsal-error.log warn;
pid nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/png png;
        image/svg+xml svg;
        video/mp4 mp4;
    }
    access_log rehearsal-access.log;
    sendfile on;
    keepalive_timeout 65;

    upstream june_api_local {
        server 127.0.0.1:8000;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate ../certs/june-local.crt;
        ssl_certificate_key ../certs/june-local.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /health {
            proxy_pass http://june_api_local/health;
        }

        location /metrics {
            proxy_pass http://june_api_local/metrics;
        }

        location /api/ {
            proxy_pass http://june_api_local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no always;
        }

        location /assets/ {
            root ../../frontend/dist;
            try_files $uri =404;
        }

        location / {
            root ../../frontend/dist;
            try_files $uri /index.html;
        }
    }
}
