user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
                                '"method":"$request_method","uri":"$uri","status":"$status",'
                                '"bytes":"$body_bytes_sent","request_time":"$request_time",'
                                '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    server_tokens off;

    upstream june_api {
        server june-api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /health {
            proxy_pass http://june_api/health;
            access_log off;
        }

        location /metrics {
            proxy_pass http://june_api/metrics;
        }

        location /api/ {
            proxy_pass http://june_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no always;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
